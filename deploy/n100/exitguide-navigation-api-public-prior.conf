[Service]
WorkingDirectory=/srv/exitguide/runtime/navigation-api-current-code/apps/api
# Production Runtime DB already locked this exact app split. TVING remains a
# separate validation-only app and must not rewrite the production manifest.
Environment=NAVIGATION_DATASET_SPLIT_MANIFEST_PATH=/srv/exitguide/runtime/navigation-dataset-split-production-9fa006ad.json
# B is the fixed production architecture. Public navigation knowledge remains
# advisory-only and cannot create candidates, execute actions, or self-promote.
# Retrieval defects are corrected inside B; production does not fall back to A.
Environment=NAVIGATION_PUBLIC_PRIOR_ENABLED=true
# The base service's common EnvironmentFile contains the preserved legacy
# Decision path. Load this non-secret override last so the effective process,
# not merely the drop-in text, uses the patched immutable clone.
EnvironmentFile=/srv/exitguide/runtime/navigation-api-tving-fix.env
Environment=NAVIGATION_PUBLIC_PRIOR_DB_PATH=/srv/exitguide/data/curated/navigation-service-v2/current/public-navigation-service-search.v4.sqlite
Environment=NAVIGATION_PUBLIC_FAILURE_DB_PATH=/srv/exitguide/data/curated/navigation-service-v2/current/public-navigation-failure-analysis.v1.sqlite
Environment=NAVIGATION_PUBLIC_TASK_DB_PATH=/srv/exitguide/data/curated/navigation-service-v2/current/navigation-service-task-knowledge.v1.sqlite
Environment=NAVIGATION_PUBLIC_PRIOR_MAX_RESULTS=3
