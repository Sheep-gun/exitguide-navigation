<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EGL Dark Pattern MVP</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17211d;
        --muted: #66736d;
        --line: #d7dfda;
        --paper: #f3f6f3;
        --card: #ffffff;
        --green: #0c6b4f;
        --green-soft: #e2f2eb;
        --red: #b53d32;
        --red-soft: #fbe8e5;
        --amber: #9a6008;
        --amber-soft: #fff1d7;
        font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }
      body { background: var(--paper); color: var(--ink); margin: 0; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      h1, h2, h3, p { margin: 0; }
      p { color: var(--muted); line-height: 1.55; }
      a { color: var(--green); font-weight: 800; }

      main { margin: 0 auto; max-width: 1180px; padding: 28px 20px 60px; }
      header { align-items: end; display: flex; gap: 22px; justify-content: space-between; margin-bottom: 22px; }
      h1 { font-size: clamp(30px, 4vw, 48px); line-height: 1.05; margin: 8px 0; }
      .eyebrow { color: var(--green); font-size: 12px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
      .header-links { display: flex; flex-wrap: wrap; gap: 14px; }

      .scenario-bar { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); margin-bottom: 20px; }
      .scenario-button { background: white; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 14px; text-align: left; }
      .scenario-button strong { display: block; margin-bottom: 4px; }
      .scenario-button span { color: var(--muted); font-size: 12px; }
      .scenario-button.active { border-color: var(--green); box-shadow: inset 4px 0 var(--green); }

      .layout { display: grid; gap: 22px; grid-template-columns: minmax(380px, 0.85fr) minmax(420px, 1.15fr); }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
      .stack { display: grid; gap: 14px; }
      .settings { display: grid; gap: 10px; grid-template-columns: 0.85fr 1.15fr; }
      label { color: var(--muted); display: grid; font-size: 11px; font-weight: 900; gap: 6px; text-transform: uppercase; }
      input { border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 10px 11px; width: 100%; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #88cbb6; outline-offset: 2px; }

      .phone-shell { background: #1f2823; border: 8px solid #1f2823; border-radius: 34px; margin: 0 auto; max-width: 390px; overflow: hidden; }
      .phone-bar { align-items: center; background: #f8faf8; display: flex; font-size: 12px; font-weight: 800; justify-content: space-between; padding: 12px 18px 9px; }
      .phone-screen { background: #fbfcfb; min-height: 590px; padding: 25px 18px; }
      .phone-screen h2 { font-size: 25px; margin-bottom: 7px; }
      .phone-note { font-size: 13px; margin-bottom: 22px; }
      .elements { display: grid; gap: 11px; }
      .screen-element { background: white; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 14px; text-align: left; width: 100%; }
      .screen-element small { color: var(--muted); display: block; margin-top: 6px; }
      .screen-element.prominence-3 { background: var(--green); border-color: var(--green); color: white; font-weight: 900; }
      .screen-element.prominence-3 small { color: #d9f2e9; }
      .screen-element.prominence-1 { font-size: 13px; }
      .screen-element.risk-high { border-color: var(--red); box-shadow: 0 0 0 2px #f1b8b2; }
      .screen-element.risk-medium { border-color: #d99831; box-shadow: 0 0 0 2px #f4d7a7; }
      .screen-element.safe-target { border-color: var(--green); box-shadow: inset 4px 0 var(--green); }
      .screen-element.prominence-3.risk-high { background: var(--red); }
      .checkbox { display: inline-block; font-weight: 900; margin-right: 8px; width: 18px; }

      .result-head { align-items: start; display: flex; gap: 14px; justify-content: space-between; }
      .risk-badge { border-radius: 999px; font-size: 12px; font-weight: 900; padding: 7px 10px; }
      .risk-badge.high { background: var(--red-soft); color: var(--red); }
      .risk-badge.medium { background: var(--amber-soft); color: var(--amber); }
      .risk-badge.low { background: var(--green-soft); color: var(--green); }
      .meter { background: #e8eeea; border-radius: 999px; height: 10px; overflow: hidden; }
      .meter span { background: var(--green); display: block; height: 100%; }
      .finding { background: var(--red-soft); border-left: 4px solid var(--red); border-radius: 5px; display: grid; gap: 6px; padding: 12px; }
      .finding.medium { background: var(--amber-soft); border-color: var(--amber); }
      .finding p { color: inherit; font-size: 13px; }
      .safe-action { background: var(--green-soft); border-left: 4px solid var(--green); border-radius: 5px; display: grid; gap: 6px; padding: 13px; }
      .proof { border-top: 1px solid var(--line); display: grid; gap: 8px; padding-top: 13px; }
      .proof p { font-size: 12px; }
      .empty { align-items: center; display: grid; min-height: 520px; place-items: center; text-align: center; }
      .status { font-size: 12px; }

      @media (max-width: 900px) {
        header { align-items: start; flex-direction: column; }
        .scenario-bar, .layout { grid-template-columns: 1fr; }
        .settings { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">ExitGuideLab · Screen-aware protection</div>
          <h1>다크패턴을 화면에서 직접 확인</h1>
          <p>사용자 목적과 실제 선택지를 비교해 방해 요소는 빨간색, 목적에 맞는 선택지는 초록색으로 표시합니다.</p>
        </div>
        <div class="header-links">
          <a href="./navigation.html">Navigation 통합 체험</a>
          <a href="./index.html">개발 진단 화면</a>
        </div>
      </header>

      <section id="scenarioBar" class="scenario-bar" aria-label="다크패턴 사례 선택"></section>

      <section class="layout">
        <div class="panel stack">
          <div class="settings">
            <label>API Base URL<input id="apiBaseUrl" type="url" value="http://127.0.0.1:8010" /></label>
            <label>사용자 목적<input id="goalText" /></label>
          </div>
          <p id="status" class="status" role="status" aria-live="polite">분석을 준비하고 있습니다.</p>
          <div class="phone-shell" aria-label="다크패턴 가상 앱 화면">
            <div class="phone-bar"><span>12:30</span><span id="appName">EGL Demo</span><span>5G · 92%</span></div>
            <div class="phone-screen">
              <h2 id="screenTitle"></h2>
              <p id="screenNote" class="phone-note"></p>
              <div id="elements" class="elements"></div>
            </div>
          </div>
        </div>

        <div id="result" class="panel empty" aria-live="polite">
          <p>현재 화면의 선택지를 분석하고 있습니다.</p>
        </div>
      </section>
    </main>

    <script>
      const scenarios = [
        {
          id: "retention",
          label: "구독 해지 방해",
          description: "유지 혜택을 크게, 해지를 작게 표시",
          app: "EGL Stream",
          goalId: "cancel_subscription",
          goalText: "구독을 해지하고 싶어",
          title: "정말 해지하시겠어요?",
          note: "Premium을 계속 이용하면 아래 혜택을 받을 수 있어요.",
          elements: [
            { id: "discount_retention_button", text: "3개월 50% 할인받고 유지", role: "button", clickable: true, prominence: 3, note: "지금 선택하면 월 4,900원" },
            { id: "pause_subscription_button", text: "일시중지", role: "button", clickable: true, prominence: 2, note: "다음 달 자동으로 다시 시작" },
            { id: "secondary_cancel_button", text: "계속 해지", role: "button", clickable: true, prominence: 1 },
          ],
        },
        {
          id: "addon",
          label: "부가상품 기본 선택",
          description: "선택 상품이 결제 금액에 미리 포함",
          app: "EGL Market",
          goalId: "buy_without_addons",
          goalText: "추가 비용 없이 결제하고 싶어",
          title: "결제 확인",
          note: "결제할 상품과 선택 혜택을 확인하세요.",
          elements: [
            { id: "warranty_addon", text: "안심 보증 +2,900원", role: "checkbox", clickable: true, prominence: 2, defaultSelected: true, optional: true, monetaryImpact: true, note: "파손 시 최대 1회 보상" },
            { id: "shipping_addon", text: "빠른 배송 +1,500원", role: "checkbox", clickable: true, prominence: 1, defaultSelected: false, optional: true, monetaryImpact: true },
            { id: "pay", text: "39,900원 결제", role: "button", clickable: true, prominence: 3 },
          ],
        },
        {
          id: "consent",
          label: "선택 동의 묶음",
          description: "필수 약관과 마케팅 동의를 한 번에 선택",
          app: "EGL Life",
          goalId: "reject_marketing",
          goalText: "마케팅 동의 없이 가입하고 싶어",
          title: "약관 동의",
          note: "서비스 가입을 위해 약관을 확인해 주세요.",
          elements: [
            { id: "agree_all", text: "전체 동의 - 필수 약관 및 선택 마케팅 포함", role: "checkbox", clickable: true, prominence: 3, defaultSelected: true, optional: true },
            { id: "required_terms", text: "필수 이용약관 동의", role: "checkbox", clickable: true, prominence: 1, defaultSelected: true },
            { id: "marketing", text: "선택 마케팅 정보 수신 동의", role: "checkbox", clickable: true, prominence: 1, defaultSelected: true, optional: true },
            { id: "continue", text: "가입 계속", role: "button", clickable: true, prominence: 2 },
          ],
        },
      ];

      let activeScenario = structuredClone(scenarios[0]);
      let currentAnalysis = null;

      const scenarioBar = document.querySelector("#scenarioBar");
      const apiBaseUrl = document.querySelector("#apiBaseUrl");
      const goalText = document.querySelector("#goalText");
      const appName = document.querySelector("#appName");
      const screenTitle = document.querySelector("#screenTitle");
      const screenNote = document.querySelector("#screenNote");
      const elements = document.querySelector("#elements");
      const result = document.querySelector("#result");
      const status = document.querySelector("#status");

      const apiOverride = new URLSearchParams(window.location.search).get("api");
      if (apiOverride) apiBaseUrl.value = apiOverride;
      else if (window.location.protocol.startsWith("http") && window.location.port !== "8020") apiBaseUrl.value = window.location.origin;

      goalText.addEventListener("change", inspectScreen);
      renderScenarioButtons();
      selectScenario("retention");

      function renderScenarioButtons() {
        scenarioBar.innerHTML = "";
        scenarios.forEach((scenario) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `scenario-button ${scenario.id === activeScenario.id ? "active" : ""}`;
          button.dataset.scenarioId = scenario.id;
          button.innerHTML = `<strong>${escapeHtml(scenario.label)}</strong><span>${escapeHtml(scenario.description)}</span>`;
          button.addEventListener("click", () => selectScenario(scenario.id));
          scenarioBar.append(button);
        });
      }

      function selectScenario(scenarioId) {
        activeScenario = structuredClone(scenarios.find((scenario) => scenario.id === scenarioId));
        currentAnalysis = null;
        goalText.value = activeScenario.goalText;
        renderScenarioButtons();
        renderPhone();
        inspectScreen();
      }

      function renderPhone() {
        appName.textContent = activeScenario.app;
        screenTitle.textContent = activeScenario.title;
        screenNote.textContent = activeScenario.note;
        elements.innerHTML = "";
        activeScenario.elements.forEach((element) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `screen-element prominence-${element.prominence}`;
          const analyzed = currentAnalysis?.elements?.find((item) => item.id === element.id);
          if (analyzed?.risk_level === "high") button.classList.add("risk-high");
          if (analyzed?.risk_level === "medium") button.classList.add("risk-medium");
          if (currentAnalysis?.recommended_action?.target_element_id === element.id && analyzed?.direction === "supports_goal") button.classList.add("safe-target");
          const checkbox = element.role === "checkbox" ? `<span class="checkbox">${element.defaultSelected ? "☑" : "☐"}</span>` : "";
          button.innerHTML = `${checkbox}${escapeHtml(element.text)}${element.note ? `<small>${escapeHtml(element.note)}</small>` : ""}`;
          button.addEventListener("click", () => handleElementClick(element));
          elements.append(button);
        });
      }

      function handleElementClick(element) {
        if (element.role === "checkbox") {
          element.defaultSelected = !element.defaultSelected;
          if (element.id === "agree_all") {
            activeScenario.elements.filter((item) => item.role === "checkbox").forEach((item) => { item.defaultSelected = element.defaultSelected; });
          }
          renderPhone();
          inspectScreen();
          return;
        }
        status.textContent = currentAnalysis?.recommended_action?.target_element_id === element.id
          ? `'${element.text}'은 사용자 목적에 맞는 선택지입니다.`
          : `'${element.text}'을 선택하기 전에 경고 내용을 확인하세요.`;
      }

      async function inspectScreen() {
        status.textContent = "현재 화면과 사용자 목적을 비교하고 있습니다.";
        result.className = "panel empty";
        result.innerHTML = "<p>다크패턴을 분석하고 있습니다.</p>";
        try {
          const response = await fetch(`${apiBaseUrl.value.trim().replace(/\/$/, "")}/v1/dark-pattern/inspect`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              request_id: `dark_web_${Date.now()}`,
              goal_id: activeScenario.goalId,
              goal_text: goalText.value.trim(),
              screen_title: activeScenario.title,
              screen_text: `${activeScenario.note} ${activeScenario.elements.map((element) => element.text).join(" ")}`,
              elements: activeScenario.elements.map((element) => ({
                id: element.id,
                text: element.text,
                role: element.role,
                clickable: element.clickable,
                prominence: element.prominence,
                default_selected: element.defaultSelected ?? false,
                optional: element.optional ?? false,
                monetary_impact: element.monetaryImpact ?? false,
              })),
            }),
          });
          if (!response.ok) throw new Error(await response.text());
          currentAnalysis = await response.json();
          status.textContent = `분석 완료 · ${currentAnalysis.findings.length}개 패턴 감지`;
          renderPhone();
          renderResult(currentAnalysis);
        } catch (error) {
          currentAnalysis = null;
          status.textContent = "분석 실패";
          result.className = "panel stack";
          result.innerHTML = `<h2>API에 연결할 수 없습니다.</h2><p>${escapeHtml(error instanceof Error ? error.message : "알 수 없는 오류")}</p>`;
        }
      }

      function renderResult(analysis) {
        result.className = "panel stack";
        result.innerHTML = `
          <div class="result-head">
            <div><h2>${escapeHtml(analysis.screen_title)}</h2><p>${escapeHtml(analysis.goal_label)}</p></div>
            <span class="risk-badge ${escapeHtml(analysis.overall_risk)}">${escapeHtml(analysis.overall_risk.toUpperCase())}</span>
          </div>
          <div><p><strong>목적 일치도 ${analysis.alignment_score}/100</strong></p><div class="meter"><span style="width:${analysis.alignment_score}%"></span></div></div>
          <p>${escapeHtml(analysis.summary)}</p>
          <div class="stack">
            <h3>감지된 다크패턴</h3>
            ${analysis.findings.length ? analysis.findings.map(renderFinding).join("") : '<div class="safe-action"><strong>뚜렷한 방해 요소 없음</strong><p>현재 선택 상태에서는 사용자의 목적과 강하게 충돌하는 패턴이 없습니다.</p></div>'}
          </div>
          <div class="safe-action"><strong>${escapeHtml(analysis.recommended_action.title)}</strong><p>${escapeHtml(analysis.recommended_action.description)}</p></div>
          <div class="proof"><h3>판단 근거</h3>${analysis.proof_card.key_evidence.map((item) => `<p>• ${escapeHtml(item)}</p>`).join("")}<p>${escapeHtml(analysis.proof_card.disclaimer)}</p></div>
        `;
      }

      function renderFinding(finding) {
        return `<div class="finding ${escapeHtml(finding.severity)}"><strong>${escapeHtml(finding.label)}</strong><p>${escapeHtml(finding.explanation)}</p><p><strong>화면 근거:</strong> ${escapeHtml(finding.evidence)}</p></div>`;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;",
        })[character]);
      }
    </script>
  </body>
</html>
