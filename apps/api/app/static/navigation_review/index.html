<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExitGuide 판단 검토</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171a1d;
      --muted: #667078;
      --line: #dce1e4;
      --line-strong: #bcc5ca;
      --paper: #ffffff;
      --ground: #f3f5f5;
      --blue: #1867c0;
      --blue-soft: #eaf3ff;
      --green: #16724c;
      --green-soft: #e7f5ed;
      --amber: #9a5b00;
      --amber-soft: #fff3d7;
      --red: #b42318;
      --red-soft: #ffebe8;
      --shadow: 0 10px 30px rgba(20, 32, 39, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ground); color: var(--ink); }
    body { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 14px; letter-spacing: 0; }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(24, 103, 192, 0.24);
      outline-offset: 1px;
    }

    .topbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 20px;
      background: #20262a;
      color: #fff;
      border-bottom: 1px solid #111619;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; min-width: 230px; }
    .brand strong { font-size: 18px; }
    .brand span { color: #b9c4ca; font-size: 12px; }
    .top-status { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .status-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border: 1px solid #536068;
      border-radius: 6px;
      color: #dbe3e7;
      white-space: nowrap;
    }
    .status-chip.safe { border-color: #3c8569; color: #bce8d4; }
    .reviewer-wrap { display: flex; align-items: center; gap: 7px; }
    .reviewer-wrap label { color: #c7d0d4; font-size: 12px; }
    .reviewer-wrap input {
      width: 120px;
      min-height: 34px;
      border: 1px solid #59656c;
      border-radius: 5px;
      background: #151a1d;
      color: #fff;
      padding: 6px 9px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      min-height: calc(100vh - 62px);
    }
    .queue-panel {
      background: var(--paper);
      border-right: 1px solid var(--line-strong);
      min-width: 0;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 62px);
      position: sticky;
      top: 0;
    }
    .queue-controls { padding: 14px; border-bottom: 1px solid var(--line); }
    .queue-controls h1 { margin: 0 0 10px; font-size: 16px; }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-grid select, .queue-search {
      min-width: 0;
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      padding: 7px 9px;
    }
    .queue-search { width: 100%; margin-top: 8px; }
    .progress-line { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 5px; margin-top: 6px; background: #e4e8ea; overflow: hidden; }
    .progress-track span { display: block; height: 100%; background: var(--green); width: 0; transition: width 160ms ease; }
    .queue-list { overflow: auto; flex: 1; }
    .queue-item {
      width: 100%;
      min-height: 92px;
      display: block;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-left: 4px solid transparent;
      background: #fff;
      padding: 11px 12px;
      color: inherit;
    }
    .queue-item:hover { background: #f7f9fa; }
    .queue-item.active { background: var(--blue-soft); border-left-color: var(--blue); }
    .queue-item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .queue-item strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item .goal { margin-top: 6px; line-height: 1.35; color: #30383d; }
    .queue-item .meta { margin-top: 7px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .empty-list { padding: 24px 16px; color: var(--muted); text-align: center; }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #4f5960;
      font-size: 11px;
      white-space: nowrap;
    }
    .tag.reached { color: var(--green); border-color: #9bcdb5; background: var(--green-soft); }
    .tag.safety { color: var(--red); border-color: #efaaa3; background: var(--red-soft); }
    .tag.uncertain { color: var(--amber); border-color: #e9c377; background: var(--amber-soft); }
    .tag.selected { color: var(--blue); border-color: #93bde9; background: var(--blue-soft); }

    .review-main { min-width: 0; padding: 0 22px 40px; }
    .loading, .welcome {
      min-height: 52vh;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 30px;
    }
    .case-header {
      margin: 0 -22px;
      padding: 16px 22px;
      background: #fff;
      border-bottom: 1px solid var(--line-strong);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .case-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .case-title h2 { margin: 0; font-size: 20px; }
    .case-title p { margin: 5px 0 0; color: #3f484e; line-height: 1.45; }
    .case-tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .case-meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 12px; }

    .timeline-band { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .section-label { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: #59636a; text-transform: uppercase; }
    .timeline { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 3px; }
    .timeline button {
      min-width: 86px;
      height: 48px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: #323a40;
      padding: 5px 8px;
      text-align: left;
    }
    .timeline button.current { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
    .timeline button.reviewed::after { content: "검토됨"; display: block; margin-top: 2px; color: var(--green); font-size: 10px; }

    .evidence-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line-strong); }
    .screen-panel { min-width: 0; padding: 18px 18px 20px 0; }
    .screen-panel + .screen-panel { border-left: 1px solid var(--line); padding-left: 18px; padding-right: 0; }
    .screen-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .screen-head h3 { margin: 0; font-size: 15px; }
    .screen-sub { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .screen-stats { display: flex; gap: 7px; flex-wrap: wrap; margin: 12px 0; }
    .screen-texts {
      min-height: 220px;
      max-height: 390px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fafbfb;
      padding: 10px 12px;
    }
    .screen-text { padding: 7px 0; border-bottom: 1px solid #e6eaec; line-height: 1.4; overflow-wrap: anywhere; }
    .screen-text:last-child { border-bottom: 0; }
    .missing-evidence { min-height: 220px; border: 1px dashed var(--line-strong); display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }

    .data-section { padding: 20px 0; border-bottom: 1px solid var(--line-strong); }
    .data-section h3 { margin: 0 0 5px; font-size: 17px; }
    .data-section > p { margin: 0 0 12px; color: var(--muted); }
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; min-width: 840px; background: #fff; }
    th, td { padding: 10px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #f5f7f7; color: #515b61; font-size: 12px; position: sticky; top: 0; }
    tr:last-child td { border-bottom: 0; }
    tr.system-choice { background: var(--blue-soft); }
    tr.better-choice { box-shadow: inset 4px 0 0 var(--green); }
    td.candidate-copy { min-width: 300px; }
    .candidate-label { font-weight: 700; overflow-wrap: anywhere; }
    .candidate-nearby { margin-top: 4px; color: var(--muted); line-height: 1.35; max-width: 560px; overflow-wrap: anywhere; }
    .candidate-id { margin-top: 4px; color: #7a858b; font-family: Consolas, monospace; font-size: 11px; }
    .choose-button {
      min-width: 72px;
      min-height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: #30383d;
    }
    .choose-button.active { border-color: var(--green); color: var(--green); background: var(--green-soft); }

    .decision-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .fact-list { margin: 0; }
    .fact-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .fact-row dt { color: var(--muted); }
    .fact-row dd { margin: 0; overflow-wrap: anywhere; }
    details { border-top: 1px solid var(--line); padding: 10px 0; }
    details summary { cursor: pointer; font-weight: 650; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f6f7f7; border: 1px solid var(--line); padding: 10px; max-height: 320px; overflow: auto; font-size: 12px; }

    .review-editor {
      margin: 24px 0 0;
      border: 1px solid var(--line-strong);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .review-editor > header { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
    .review-editor h3 { margin: 0; font-size: 18px; }
    .review-editor header p { margin: 4px 0 0; color: var(--muted); }
    .review-fields { display: grid; grid-template-columns: 1fr 1fr; }
    fieldset { min-width: 0; margin: 0; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line); }
    fieldset:nth-child(odd) { border-right: 1px solid var(--line); }
    legend { padding: 0; font-weight: 700; font-size: 14px; }
    .question-help { color: var(--muted); font-size: 12px; margin: 5px 0 10px; }
    .segments { display: flex; flex-wrap: wrap; gap: 6px; }
    .segments label { position: relative; }
    .segments input { position: absolute; opacity: 0; pointer-events: none; }
    .segments span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: #394147;
    }
    .segments input:checked + span { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); font-weight: 700; }
    .segments input:focus-visible + span { outline: 3px solid rgba(24, 103, 192, 0.24); }
    .better-summary { margin-top: 9px; min-height: 34px; padding: 8px 10px; border-left: 3px solid var(--green); background: var(--green-soft); color: #24563f; }
    .notes-field { grid-column: 1 / -1; border-right: 0 !important; }
    .notes-field textarea { width: 100%; min-height: 86px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 5px; padding: 9px; }
    .review-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; background: #f7f8f8; }
    .review-actions .message { color: var(--muted); min-height: 20px; }
    .primary-button {
      min-width: 150px;
      min-height: 40px;
      border: 1px solid #1259a5;
      border-radius: 5px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      padding: 8px 14px;
    }
    .primary-button:disabled { opacity: 0.52; cursor: wait; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 100; min-width: 230px; max-width: 420px; padding: 12px 14px; border-radius: 6px; background: #20262a; color: #fff; box-shadow: var(--shadow); display: none; }
    .toast.show { display: block; }
    .toast.error { background: var(--red); }

    @media (max-width: 980px) {
      .topbar { flex-wrap: wrap; }
      .brand { min-width: 0; }
      .workspace { grid-template-columns: 1fr; }
      .queue-panel { position: static; max-height: 360px; border-right: 0; border-bottom: 1px solid var(--line-strong); }
      .queue-list { min-height: 170px; }
      .review-main { padding: 0 14px 30px; }
      .case-header { margin: 0 -14px; padding: 14px; position: static; }
    }
    @media (max-width: 720px) {
      .topbar { padding: 10px 12px; gap: 10px; }
      .top-status { order: 3; width: 100%; overflow-x: auto; }
      .reviewer-wrap { margin-left: auto; }
      .reviewer-wrap label { display: none; }
      .reviewer-wrap input { width: 96px; }
      .evidence-grid, .decision-grid, .review-fields { grid-template-columns: 1fr; }
      .screen-panel, .screen-panel + .screen-panel { padding: 16px 0; border-left: 0; }
      .screen-panel + .screen-panel { border-top: 1px solid var(--line); }
      fieldset:nth-child(odd) { border-right: 0; }
      .case-title { display: block; }
      .case-tags { justify-content: flex-start; margin-top: 10px; }
      .fact-row { grid-template-columns: 105px minmax(0, 1fr); }
      .review-actions { align-items: stretch; flex-direction: column; }
      .primary-button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>ExitGuide 판단 검토</strong><span>Navigation Runtime</span></div>
    <div class="top-status">
      <span class="status-chip safe" id="sourcePolicy">원본 DB 읽기 전용</span>
      <span class="status-chip" id="sourceName">연결 확인 중</span>
      <span class="status-chip" id="queueCount">대기 -</span>
    </div>
    <div class="reviewer-wrap">
      <label for="reviewer">검토자</label>
      <input id="reviewer" value="human" maxlength="80" aria-label="검토자 이름">
    </div>
  </header>

  <div class="workspace">
    <aside class="queue-panel">
      <div class="queue-controls">
        <h1>검토할 판단</h1>
        <div class="filter-grid">
          <select id="queueFilter" aria-label="검토 우선순위">
            <option value="priority">우선 검토</option>
            <option value="reached">목표 도달</option>
            <option value="safety">안전 중지</option>
            <option value="uncertain">오류·저신뢰</option>
            <option value="all">전체</option>
          </select>
          <select id="reviewStatus" aria-label="검토 상태">
            <option value="unreviewed">미검토</option>
            <option value="reviewed">검토 완료</option>
            <option value="all">모두</option>
          </select>
        </div>
        <input class="queue-search" id="searchInput" type="search" placeholder="앱·목표 검색" aria-label="앱 또는 목표 검색">
        <div class="progress-line"><span id="progressText">0 / 0 검토</span><span id="prioritySummary"></span></div>
        <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>
      </div>
      <div class="queue-list" id="queueList"><div class="empty-list">목록을 불러오는 중입니다.</div></div>
    </aside>

    <main class="review-main" id="reviewMain">
      <div class="welcome">왼쪽에서 판단 기록을 선택하세요.</div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const state = {
      queue: [],
      currentId: null,
      detail: null,
      status: null,
      betterCandidateId: null,
      loading: false,
      searchTimer: null,
    };

    const labels = {
      click: "누르기",
      scroll: "스크롤",
      back: "뒤로가기",
      wait_and_observe: "기다리기",
      stop_for_user: "사용자에게 넘김",
      reached: "목표 도달",
      advanced: "전진",
      unchanged: "변화 없음",
      regressed: "후퇴",
      unknown: "불명확",
      wrong_destination: "잘못된 화면",
      destination_reached: "목표 화면",
      navigated: "화면 이동",
      no_change: "변화 없음",
      blocked: "진행 차단",
      external_app: "외부 앱",
      login_required: "로그인 필요",
      popup: "팝업",
      network_error: "네트워크 오류",
      correct: "맞음",
      acceptable: "허용 가능",
      wrong: "틀림",
      unsafe: "위험함",
      cannot_judge: "판단 불가",
    };

    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    const pretty = (value) => escapeHtml(JSON.stringify(value ?? {}, null, 2));
    const label = (value) => labels[value] || value || "기록 없음";
    const reviewer = () => ($("#reviewer").value.trim() || "human");

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
      });
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try { message = (await response.json()).detail || message; } catch (_) {}
        throw new Error(message);
      }
      return response.json();
    }

    function showToast(message, error = false) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.className = `toast show${error ? " error" : ""}`;
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => { toast.className = "toast"; }, 2600);
    }

    function tagForCategory(category) {
      const names = { reached: "목표 도달", safety: "안전 중지", uncertain: "확인 필요", routine: "일반" };
      return `<span class="tag ${escapeHtml(category)}">${names[category] || escapeHtml(category)}</span>`;
    }

    async function loadStatus() {
      state.status = await api(`/v1/navigation/review/status?reviewer=${encodeURIComponent(reviewer())}`);
      const counts = state.status.counts;
      $("#sourceName").textContent = state.status.source_database;
      $("#progressText").textContent = `${counts.reviewed} / ${counts.decisions} 검토`;
      $("#progressFill").style.width = counts.decisions ? `${(counts.reviewed / counts.decisions) * 100}%` : "0%";
      $("#queueCount").textContent = `남음 ${counts.remaining}`;
    }

    async function loadQueue({ keepCurrent = true } = {}) {
      const params = new URLSearchParams({
        reviewer: reviewer(),
        queue: $("#queueFilter").value,
        review_status: $("#reviewStatus").value,
        query: $("#searchInput").value.trim(),
        limit: "200",
      });
      const data = await api(`/v1/navigation/review/queue?${params}`);
      state.queue = data.items;
      $("#prioritySummary").textContent = `도달 ${data.category_counts.reached} · 안전 ${data.category_counts.safety}`;
      renderQueue();
      if (!keepCurrent || !state.currentId || !state.queue.some((item) => item.decision_id === state.currentId)) {
        if (state.queue.length) await loadDetail(state.queue[0].decision_id);
        else {
          state.currentId = null;
          state.detail = null;
          $("#reviewMain").innerHTML = `<div class="welcome">현재 조건에 맞는 검토 대상이 없습니다.</div>`;
        }
      }
    }

    function renderQueue() {
      const list = $("#queueList");
      if (!state.queue.length) {
        list.innerHTML = `<div class="empty-list">현재 조건에 맞는 기록이 없습니다.</div>`;
        return;
      }
      list.innerHTML = state.queue.map((item) => `
        <button class="queue-item ${item.decision_id === state.currentId ? "active" : ""}" data-decision-id="${escapeHtml(item.decision_id)}">
          <span class="row"><strong>${escapeHtml(item.app_package)}</strong>${tagForCategory(item.category)}</span>
          <span class="goal">${escapeHtml(item.goal_text_redacted)}</span>
          <span class="meta"><span>${escapeHtml(item.step_ordinal)}단계</span><span>${escapeHtml(label(item.action_name))}</span><span>${escapeHtml(label(item.progress_label || item.outcome_type))}</span></span>
        </button>
      `).join("");
      list.querySelectorAll(".queue-item").forEach((button) => {
        button.addEventListener("click", () => loadDetail(button.dataset.decisionId));
      });
    }

    async function loadDetail(decisionId) {
      state.currentId = decisionId;
      state.loading = true;
      renderQueue();
      $("#reviewMain").innerHTML = `<div class="loading">판단 근거를 불러오는 중입니다.</div>`;
      try {
        state.detail = await api(`/v1/navigation/review/decisions/${encodeURIComponent(decisionId)}?reviewer=${encodeURIComponent(reviewer())}`);
        state.betterCandidateId = state.detail.human_review?.better_candidate_id || null;
        renderDetail();
      } catch (error) {
        $("#reviewMain").innerHTML = `<div class="welcome">불러오지 못했습니다.<br>${escapeHtml(error.message)}</div>`;
        showToast(error.message, true);
      } finally {
        state.loading = false;
      }
    }

    function renderTimeline(timeline) {
      return `<div class="timeline-band"><p class="section-label">세션 진행 순서</p><div class="timeline">${timeline.map((step) => `
        <button type="button" class="${step.decision_id === state.currentId ? "current" : ""} ${step.reviewed ? "reviewed" : ""}" data-timeline-id="${escapeHtml(step.decision_id)}">
          <strong>${escapeHtml(step.step_ordinal)}단계</strong><br><span>${escapeHtml(label(step.action_name))}</span>
        </button>`).join("")}</div></div>`;
    }

    function screenHtml(screen, title) {
      if (!screen) {
        return `<section class="screen-panel"><div class="screen-head"><div><h3>${title}</h3><div class="screen-sub">자료 없음</div></div></div><div class="missing-evidence">이 단계에는 화면 기록이 없습니다.<br>판단할 때 근거 부족으로 표시하세요.</div></section>`;
      }
      const texts = screen.visible_texts.length
        ? screen.visible_texts.map((text) => `<div class="screen-text">${escapeHtml(text)}</div>`).join("")
        : `<div class="screen-text">읽을 수 있는 화면 문구가 없습니다.</div>`;
      return `<section class="screen-panel">
        <div class="screen-head"><div><h3>${title}</h3><div class="screen-sub">${escapeHtml(screen.window_title || "제목 없음")} · ${escapeHtml(screen.activity_name)}</div></div><span class="tag">${escapeHtml(screen.candidate_set_status)}</span></div>
        <div class="screen-stats"><span class="tag">문구 ${screen.visible_texts.length}</span><span class="tag">후보 ${screen.candidates_captured}/${screen.candidates_total}</span><span class="tag">노드 ${screen.nodes_captured}/${screen.nodes_total}</span>${screen.nodes_truncated || screen.candidates_truncated ? '<span class="tag uncertain">일부 누락</span>' : ""}</div>
        <div class="screen-texts">${texts}</div>
      </section>`;
    }

    function candidateRows(detail) {
      const before = detail.screens.before;
      if (!before || !before.candidates.length) {
        return `<div class="missing-evidence">선택 후보 기록이 없습니다.</div>`;
      }
      const boundaryId = detail.decision.boundary_candidate_id;
      const rows = before.candidates.map((candidate) => {
        const payload = candidate.observed_payload || {};
        const systemChoice = candidate.candidate_id === boundaryId || Boolean(candidate.selected);
        const betterChoice = candidate.candidate_id === state.betterCandidateId;
        return `<tr class="${systemChoice ? "system-choice" : ""} ${betterChoice ? "better-choice" : ""}">
          <td>${escapeHtml(candidate.ordinal + 1)}</td>
          <td class="candidate-copy"><div class="candidate-label">${escapeHtml(payload.label || payload.icon_semantics || "이름 없는 후보")}</div><div class="candidate-nearby">${escapeHtml(payload.nearby_text || payload.parent_semantics || "주변 문구 없음")}</div><div class="candidate-id">${escapeHtml(candidate.candidate_id)}</div></td>
          <td>${escapeHtml(payload.role || "-")}<br><span class="screen-sub">${escapeHtml(payload.position_bucket || payload.visual_region || "")}</span></td>
          <td><span class="tag ${candidate.risk_level === "high" || candidate.risk_level === "blocked" ? "safety" : ""}">${escapeHtml(candidate.risk_level)}</span>${candidate.forbidden ? '<br><span class="tag safety">금지됨</span>' : ""}</td>
          <td>${candidate.final_score == null ? "-" : Number(candidate.final_score).toFixed(3)}<br><span class="screen-sub">${escapeHtml(candidate.score_source || "")}</span></td>
          <td>${systemChoice ? '<span class="tag selected">시스템 기준</span>' : ""}</td>
          <td><button type="button" class="choose-button ${betterChoice ? "active" : ""}" data-candidate-id="${escapeHtml(candidate.candidate_id)}">${betterChoice ? "선택됨" : "더 나음"}</button></td>
        </tr>`;
      }).join("");
      return `<div class="table-wrap"><table><thead><tr><th>#</th><th>화면 후보</th><th>종류·위치</th><th>위험</th><th>점수</th><th>현재 판단</th><th>사람 선택</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function selectedCandidateLabel(detail) {
      if (!state.betterCandidateId) return "선택한 더 나은 후보 없음";
      const candidate = detail.screens.before?.candidates.find((item) => item.candidate_id === state.betterCandidateId);
      return candidate?.observed_payload?.label || state.betterCandidateId;
    }

    function factsHtml(detail) {
      const d = detail.decision;
      const actual = d.actual_action || {};
      return `<section class="data-section"><h3>시스템 판단과 실제 결과</h3><p>선택 이유와 실행 결과를 나란히 확인합니다.</p>
        <div class="decision-grid">
          <dl class="fact-list">
            <div class="fact-row"><dt>선택 행동</dt><dd><strong>${escapeHtml(label(d.action_name))}</strong>${d.boundary_candidate_id ? `<br><span class="candidate-id">${escapeHtml(d.boundary_candidate_id)}</span>` : ""}</dd></div>
            <div class="fact-row"><dt>선택 확신</dt><dd>${Number(d.confidence).toFixed(3)} · 점수 차 ${Number(d.score_margin).toFixed(3)}</dd></div>
            <div class="fact-row"><dt>안전 판정</dt><dd>${escapeHtml(d.safety_status)}<br><span class="screen-sub">${escapeHtml(d.safety_reason)}</span></dd></div>
            <div class="fact-row"><dt>계획 단계</dt><dd>${escapeHtml(d.plan_stage)}<br><span class="screen-sub">${escapeHtml(d.plan?.immediate_subgoal || "")}</span></dd></div>
            <div class="fact-row"><dt>판단 방식</dt><dd>${escapeHtml(d.planner_provider)}</dd></div>
          </dl>
          <dl class="fact-list">
            <div class="fact-row"><dt>실행 상태</dt><dd>${escapeHtml(d.execution_status || "기록 없음")} · ${d.execution_succeeded === null || d.execution_succeeded === undefined ? "성공 여부 없음" : d.execution_succeeded ? "실행됨" : "실행 실패"}</dd></div>
            <div class="fact-row"><dt>실제 행동</dt><dd>${escapeHtml(actual.action || actual.name || actual.type || d.action_name || "기록 없음")}</dd></div>
            <div class="fact-row"><dt>화면 변화</dt><dd>${d.state_changed === null || d.state_changed === undefined ? "기록 없음" : d.state_changed ? "변함" : "변하지 않음"}</dd></div>
            <div class="fact-row"><dt>진행 판정</dt><dd><strong>${escapeHtml(label(d.progress_label))}</strong> · ${escapeHtml(label(d.outcome_type))}</dd></div>
            <div class="fact-row"><dt>실패 원인</dt><dd>${escapeHtml(d.failure_class || d.failure_code || "없음")}</dd></div>
          </dl>
        </div>
        <details><summary>RAG 근거와 판단 출처</summary><pre>${pretty({ evidence_case_ids: d.evidence_case_ids, retrieval_hits: d.retrieval_hits, provenance: d.decision_provenance })}</pre></details>
        <details><summary>계획·후보 점수 원문</summary><pre>${pretty({ plan: d.plan, candidate_values: d.candidate_values, proposed_action: d.proposed_action, safety_rewritten_action: d.safety_rewritten_action })}</pre></details>
      </section>`;
    }

    function radioGroup(name, options, current) {
      return `<div class="segments">${options.map(([value, text]) => `<label><input type="radio" name="${name}" value="${value}" ${current === value ? "checked" : ""} required><span>${text}</span></label>`).join("")}</div>`;
    }

    function reviewForm(detail) {
      const review = detail.human_review || {};
      const machine = detail.machine_assessment;
      return `<form class="review-editor" id="reviewForm">
        <header><div><h3>사람 판정</h3><p>모호한 품질 점수 대신 실제 선택과 결과를 확인합니다.</p></div>${machine ? '<span class="tag selected">AI 사전판정 있음</span>' : '<span class="tag">AI 사전판정 없음</span>'}</header>
        ${machine ? `<details style="padding:12px 18px"><summary>AI 사전판정 보기</summary><pre>${pretty(machine.assessment)}</pre></details>` : ""}
        <div class="review-fields">
          <fieldset><legend>1. 이 행동 선택이 맞았나?</legend><div class="question-help">목표와 현재 화면을 기준으로 판단합니다.</div>${radioGroup("action_judgment", [["correct","맞음"],["acceptable","허용 가능"],["wrong","틀림"],["unsafe","위험함"],["cannot_judge","판단 불가"]], review.action_judgment)}</fieldset>
          <fieldset><legend>2. 실제로 목표에 가까워졌나?</legend><div class="question-help">행동 전후 화면의 변화를 판단합니다.</div>${radioGroup("progress_judgment", [["advanced","전진"],["unchanged","변화 없음"],["regressed","후퇴"],["reached","목표 도달"],["unknown","불명확"]], review.progress_judgment)}</fieldset>
          <fieldset><legend>3. 정말 사람이 이어서 해야 하는 지점인가?</legend><div class="question-help">되돌릴 수 없는 최종 확정 행동인지 확인합니다.</div>${radioGroup("safety_boundary_judgment", [["true","맞음"],["false","아님"],["unknown","불명확"]], review.safety_boundary_judgment)}</fieldset>
          <fieldset><legend>4. 더 나은 화면 후보가 있었나?</legend><div class="question-help">후보 표에서 직접 고르거나 아래에서 없음·불명확을 선택합니다.</div>${radioGroup("better_candidate_status", [["none","더 나은 후보 없음"],["unknown","판단 불가"]], review.better_candidate_status === "selected" ? "" : review.better_candidate_status)}<div class="better-summary" id="betterSummary">${escapeHtml(selectedCandidateLabel(detail))}</div></fieldset>
          <fieldset><legend>5. 시스템의 성공·도달 판정이 맞나?</legend><div class="question-help">도달 판정이 없는 중간 단계라면 해당 없음을 고릅니다.</div>${radioGroup("system_success_judgment", [["correct","맞음"],["incorrect","틀림"],["unknown","불명확"],["not_applicable","해당 없음"]], review.system_success_judgment)}</fieldset>
          <fieldset class="notes-field"><legend>메모</legend><div class="question-help">오판 이유나 수정 규칙이 분명할 때만 적습니다.</div><textarea name="notes" maxlength="2000" placeholder="선택 사항">${escapeHtml(review.notes || "")}</textarea></fieldset>
        </div>
        <div class="review-actions"><div class="message" id="formMessage">${review.updated_at ? `마지막 저장: ${escapeHtml(review.updated_at)}` : "다섯 항목을 선택하면 검토 결과만 별도 DB에 저장됩니다."}</div><button class="primary-button" id="saveButton" type="submit">저장하고 다음</button></div>
      </form>`;
    }

    function renderDetail() {
      const detail = state.detail;
      const d = detail.decision;
      const category = state.queue.find((item) => item.decision_id === d.decision_id)?.category || (d.progress_label === "reached" ? "reached" : d.action_name === "stop_for_user" ? "safety" : "routine");
      $("#reviewMain").innerHTML = `
        <header class="case-header">
          <div class="case-title"><div><h2>${escapeHtml(d.app_package)}</h2><p>${escapeHtml(d.goal_text_redacted)}</p></div><div class="case-tags">${tagForCategory(category)}<span class="tag">${escapeHtml(label(d.action_name))}</span>${d.evidence_complete ? '<span class="tag reached">근거 완전</span>' : '<span class="tag uncertain">근거 일부 없음</span>'}</div></div>
          <div class="case-meta"><span>앱 ${escapeHtml(d.app_version || "버전 없음")}</span><span>Android ${escapeHtml(d.android_release || "-")} / API ${escapeHtml(d.android_api_level || "-")}</span><span>수집기 ${escapeHtml(d.collector_app_version || "-")}</span><span>세션 ${escapeHtml(d.session_id)}</span></div>
        </header>
        ${renderTimeline(detail.timeline)}
        <div class="evidence-grid">${screenHtml(detail.screens.before, "행동 전 화면")}${screenHtml(detail.screens.after, "행동 후 화면")}</div>
        <section class="data-section"><h3>행동 전 후보 전체</h3><p>파란 행은 시스템이 기준으로 삼은 후보입니다. 더 적절한 후보가 있으면 오른쪽에서 선택합니다.</p>${candidateRows(detail)}</section>
        ${factsHtml(detail)}
        ${reviewForm(detail)}
      `;
      $("#reviewMain").querySelectorAll("[data-timeline-id]").forEach((button) => button.addEventListener("click", () => loadDetail(button.dataset.timelineId)));
      $("#reviewMain").querySelectorAll("[data-candidate-id]").forEach((button) => button.addEventListener("click", () => {
        state.betterCandidateId = button.dataset.candidateId;
        $("#reviewMain").querySelectorAll("tbody tr").forEach((row) => row.classList.remove("better-choice"));
        $("#reviewMain").querySelectorAll(".choose-button").forEach((candidateButton) => {
          const active = candidateButton.dataset.candidateId === state.betterCandidateId;
          candidateButton.classList.toggle("active", active);
          candidateButton.textContent = active ? "선택됨" : "더 나음";
          if (active) candidateButton.closest("tr")?.classList.add("better-choice");
        });
        $("#reviewMain").querySelectorAll('input[name="better_candidate_status"]').forEach((input) => { input.checked = false; });
        $("#betterSummary").textContent = selectedCandidateLabel(state.detail);
      }));
      $("#reviewMain").querySelectorAll('input[name="better_candidate_status"]').forEach((input) => input.addEventListener("change", () => {
        state.betterCandidateId = null;
        $("#betterSummary").textContent = "선택한 더 나은 후보 없음";
        $("#reviewMain").querySelectorAll("tbody tr").forEach((row) => row.classList.remove("better-choice"));
        $("#reviewMain").querySelectorAll(".choose-button").forEach((button) => {
          button.classList.remove("active");
          button.textContent = "더 나음";
        });
      }));
      $("#reviewForm").addEventListener("submit", saveReview);
    }

    async function saveReview(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);
      const required = ["action_judgment", "progress_judgment", "safety_boundary_judgment", "system_success_judgment"];
      if (required.some((key) => !data.get(key))) {
        showToast("네 가지 핵심 판정을 모두 선택하세요.", true);
        return;
      }
      let betterStatus = data.get("better_candidate_status");
      if (state.betterCandidateId) betterStatus = "selected";
      if (!betterStatus) {
        showToast("더 나은 후보 여부를 선택하세요.", true);
        return;
      }
      const payload = {
        reviewer: reviewer(),
        action_judgment: data.get("action_judgment"),
        progress_judgment: data.get("progress_judgment"),
        safety_boundary_judgment: data.get("safety_boundary_judgment"),
        better_candidate_status: betterStatus,
        better_candidate_id: betterStatus === "selected" ? state.betterCandidateId : null,
        system_success_judgment: data.get("system_success_judgment"),
        notes: data.get("notes") || "",
      };
      const button = $("#saveButton");
      button.disabled = true;
      $("#formMessage").textContent = "저장 중...";
      try {
        await api(`/v1/navigation/review/decisions/${encodeURIComponent(state.currentId)}`, { method: "PUT", body: JSON.stringify(payload) });
        showToast("검토 결과를 저장했습니다.");
        await loadStatus();
        await loadQueue({ keepCurrent: false });
      } catch (error) {
        button.disabled = false;
        $("#formMessage").textContent = error.message;
        showToast(error.message, true);
      }
    }

    async function refresh() {
      try {
        await loadStatus();
        await loadQueue({ keepCurrent: true });
      } catch (error) {
        showToast(error.message, true);
        $("#queueList").innerHTML = `<div class="empty-list">서버 연결 실패<br>${escapeHtml(error.message)}</div>`;
      }
    }

    $("#reviewer").value = localStorage.getItem("exitguideReviewer") || "human";
    $("#reviewer").addEventListener("change", () => {
      localStorage.setItem("exitguideReviewer", reviewer());
      state.currentId = null;
      refresh();
    });
    $("#queueFilter").addEventListener("change", () => loadQueue({ keepCurrent: false }));
    $("#reviewStatus").addEventListener("change", () => loadQueue({ keepCurrent: false }));
    $("#searchInput").addEventListener("input", () => {
      window.clearTimeout(state.searchTimer);
      state.searchTimer = window.setTimeout(() => loadQueue({ keepCurrent: false }), 250);
    });
    refresh();
  </script>
</body>
</html>
