name: Navigation DB Redesign Checks

on:
  push:
    branches:
      - main
      - agent/navigation-db-redesign
  pull_request:
    paths:
      - "apps/api/**"
      - "db/**"
      - "docs/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/navigation-db-redesign-checks.yml"
  workflow_dispatch:

concurrency:
  group: navigation-db-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Navigation API dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Compile retained Python sources
        run: python -m compileall -q apps/api/app scripts

      - name: Test decision memory
        run: python apps/api/tests/navigation_decision_memory_unit.py

      - name: Test standards experience profile
        run: python apps/api/tests/navigation_experience_profile_unit.py

      - name: Test interaction episode adapter
        run: python apps/api/tests/navigation_interaction_adapter_unit.py

      - name: Test research architecture
        run: python apps/api/tests/navigation_research_architecture_unit.py

      - name: Test API runtime and safety gates
        run: python apps/api/tests/navigation_runtime_unit.py
