name: ExitGuide Checks

on:
  push:
  pull_request:

jobs:
  local-checks:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache bootstrap tools
        uses: actions/cache@v4
        with:
          path: |
            .tools
            apps/mobile/node_modules
          key: exitguide-${{ runner.os }}-${{ hashFiles('scripts/Bootstrap-Windows.ps1', 'scripts/ExitGuide.Common.psm1', 'scripts/Publish-GitHub.ps1', 'apps/mobile/package-lock.json') }}
          restore-keys: |
            exitguide-${{ runner.os }}-

      - name: Bootstrap and run local checks
        shell: pwsh
        run: .\scripts\Bootstrap-Windows.ps1
