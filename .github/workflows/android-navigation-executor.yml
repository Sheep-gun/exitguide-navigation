name: Android Navigation Executor

on:
  push:
    branches:
      - main
      - agent/navigation-db-redesign
    paths:
      - "apps/android-executor/**"
      - ".github/workflows/android-navigation-executor.yml"
  pull_request:
    paths:
      - "apps/android-executor/**"
      - ".github/workflows/android-navigation-executor.yml"
  workflow_dispatch:

concurrency:
  group: android-navigation-executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/android-executor/**/*.gradle*

      - name: Test and build debug APK
        working-directory: apps/android-executor
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-executor-debug
          path: apps/android-executor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
