<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">EGL Navigation 1분 그래프 탐색과 사용자 주도 안내 파이프라인</title>
  <desc id="desc">사용자 목적을 최종 기능으로 정의하고, 기존 기능 그래프가 없으면 안전한 메뉴만 1분 이내 목표 지향적으로 자동 탐색한다. 탐색 완료 후 시작 화면으로 복귀해 자동 터치를 종료하고, 사용자가 안내에 따라 최종 목적지까지 모든 메뉴를 직접 누른다. 성공한 사용자 경로는 앱별 기능 그래프에 반영한다.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" class="arrow-head"/>
    </marker>
    <marker id="arrow-accent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" class="arrow-head-accent"/>
    </marker>
  </defs>

  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --lane: #eef2f7;
      --text: #0f172a;
      --muted: #526176;
      --line: #64748b;
      --border: #cbd5e1;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --teal: #0f766e;
      --teal-soft: #ccfbf1;
      --purple: #7c3aed;
      --purple-soft: #ede9fe;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --green: #15803d;
      --green-soft: #dcfce7;
      --red: #b91c1c;
      --red-soft: #fee2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --panel: #111827;
        --lane: #172033;
        --text: #f8fafc;
        --muted: #b7c2d0;
        --line: #94a3b8;
        --border: #3b4a60;
        --blue: #60a5fa;
        --blue-soft: #172554;
        --teal: #5eead4;
        --teal-soft: #113a38;
        --purple: #c4b5fd;
        --purple-soft: #2e2251;
        --amber: #fbbf24;
        --amber-soft: #4a3413;
        --green: #86efac;
        --green-soft: #173b28;
        --red: #fca5a5;
        --red-soft: #4a1d22;
      }
    }
    .background { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--border); stroke-width: 1.5; }
    .explorer-field { fill: var(--panel); stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 7 6; }
    .node { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; filter: url(#shadow); }
    .node-blue { fill: var(--blue-soft); stroke: var(--blue); }
    .node-teal { fill: var(--teal-soft); stroke: var(--teal); }
    .node-purple { fill: var(--purple-soft); stroke: var(--purple); }
    .node-amber { fill: var(--amber-soft); stroke: var(--amber); }
    .node-green { fill: var(--green-soft); stroke: var(--green); }
    .node-red { fill: var(--red-soft); stroke: var(--red); }
    .decision { fill: var(--purple-soft); stroke: var(--purple); stroke-width: 1.8; filter: url(#shadow); }
    .flow { fill: none; stroke: var(--line); stroke-width: 2.4; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    .flow-accent { fill: none; stroke: var(--teal); stroke-width: 2.8; marker-end: url(#arrow-accent); stroke-linecap: round; stroke-linejoin: round; }
    .flow-dashed { fill: none; stroke: var(--blue); stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow-accent); stroke-linecap: round; stroke-linejoin: round; }
    .arrow-head { fill: var(--line); }
    .arrow-head-accent { fill: var(--teal); }
    text { font-family: Pretendard, "Noto Sans KR", "Segoe UI", sans-serif; fill: var(--text); }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.7px; }
    .subtitle { font-size: 17px; fill: var(--muted); }
    .lane-title { font-size: 18px; font-weight: 700; }
    .lane-note { font-size: 14px; fill: var(--muted); }
    .node-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .node-body { font-size: 14px; fill: var(--muted); text-anchor: middle; }
    .decision-text { font-size: 16px; font-weight: 700; text-anchor: middle; }
    .decision-sub { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
    .edge-label { font-size: 13px; font-weight: 700; fill: var(--muted); }
    .edge-label-accent { font-size: 13px; font-weight: 700; fill: var(--teal); }
    .step-circle { fill: var(--text); }
    .step-number { fill: var(--bg); font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .badge { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .badge-text { font-size: 12.5px; fill: var(--muted); text-anchor: middle; font-weight: 600; }
    .footer { font-size: 14px; fill: var(--muted); }
    .footer-strong { font-size: 14px; fill: var(--text); font-weight: 700; }
  </style>

  <rect class="background" x="0" y="0" width="1600" height="1120"/>

  <text class="title" x="62" y="62">EGL Navigation · 1분 그래프 탐색과 사용자 주도 안내</text>
  <text class="subtitle" x="62" y="98">자동 터치는 그래프 탐색에만 사용합니다. 실제 안내가 시작되면 사용자가 최종 목적지까지 모든 메뉴를 직접 누릅니다.</text>

  <!-- Lane 1: Goal definition and route availability -->
  <rect class="lane" x="45" y="135" width="1510" height="205" rx="24"/>
  <text class="lane-title" x="70" y="170">1 · 목적 정의와 경로 준비</text>
  <text class="lane-note" x="70" y="194">K-EXAONE은 시작 시 목적 구조화에 사용하고, 이후에는 모호한 분기에서만 제한적으로 호출합니다.</text>

  <g aria-label="사용자 목적과 대상 앱 입력">
    <rect class="node node-blue" x="90" y="215" width="230" height="92" rx="18"/>
    <circle class="step-circle" cx="112" cy="235" r="13"/><text class="step-number" x="112" y="235">1</text>
    <text class="node-title" x="205" y="250">목적 · 대상 앱 입력</text>
    <text class="node-body" x="205" y="276">“YouTube Premium을</text>
    <text class="node-body" x="205" y="296">해지하고 싶어”</text>
  </g>

  <path class="flow" d="M 320 261 H 385"/>

  <g aria-label="최종 기능 정의">
    <rect class="node node-purple" x="385" y="205" width="285" height="112" rx="18"/>
    <circle class="step-circle" cx="407" cy="225" r="13"/><text class="step-number" x="407" y="225">2</text>
    <text class="node-title" x="527" y="242">최종 기능 정의</text>
    <text class="node-body" x="527" y="270">intent: subscription_cancellation</text>
    <text class="node-body" x="527" y="292">terminal: billing.cancel.confirm</text>
  </g>

  <path class="flow" d="M 670 261 H 730"/>

  <g aria-label="현재 앱 상태와 기존 그래프 조회">
    <rect class="node" x="730" y="205" width="275" height="112" rx="18"/>
    <circle class="step-circle" cx="752" cy="225" r="13"/><text class="step-number" x="752" y="225">3</text>
    <text class="node-title" x="867" y="242">앱 상태 · 그래프 조회</text>
    <text class="node-body" x="867" y="270">package · version · locale</text>
    <text class="node-body" x="867" y="292">현재 화면 지문과 기존 경로 비교</text>
  </g>

  <path class="flow" d="M 1005 261 H 1060"/>

  <g aria-label="유효한 앱 그래프 존재 여부">
    <path class="decision" d="M 1160 184 L 1260 261 L 1160 328 L 1060 261 Z"/>
    <text class="decision-text" x="1160" y="251">유효한 앱 그래프?</text>
    <text class="decision-sub" x="1160" y="274">현재 버전과 경로 일치</text>
  </g>

  <path class="flow-accent" d="M 1260 261 H 1310"/>
  <text class="edge-label-accent" x="1278" y="246">있음</text>

  <g aria-label="기존 그래프로 사용자 안내 경로 계산">
    <rect class="node node-green" x="1310" y="210" width="205" height="102" rx="18"/>
    <circle class="step-circle" cx="1332" cy="230" r="13"/><text class="step-number" x="1332" y="230">4A</text>
    <text class="node-title" x="1412" y="250">사용자 안내 경로</text>
    <text class="node-body" x="1412" y="278">자동 터치 없음 · 단계별 안내</text>
    <text class="node-body" x="1412" y="298">목표 1–3초</text>
  </g>

  <!-- Lane 2: Cold-start automatic exploration -->
  <rect class="lane" x="45" y="370" width="1510" height="410" rx="24"/>
  <text class="lane-title" x="70" y="407">2 · 그래프가 없거나 깨진 경우: 목적 지향 자동 탐색</text>
  <text class="lane-note" x="70" y="431">목표 예산: 최대 45초 · 깊이 6–8 · 자동 조작 10–15회 · 화면별 상위 후보 1–2개</text>

  <path class="flow" d="M 1160 328 V 355 H 58 V 500 H 200 V 515"/>
  <text class="edge-label" x="1015" y="350">없음 / 버전 불일치</text>

  <rect class="explorer-field" x="75" y="447" width="1215" height="302" rx="20"/>
  <rect class="badge" x="93" y="463" width="178" height="30" rx="15"/>
  <text class="badge-text" x="182" y="483">4B · SAFE EXPLORER</text>

  <g aria-label="현재 화면 수집">
    <rect class="node node-teal" x="105" y="515" width="190" height="88" rx="16"/>
    <text class="node-title" x="200" y="548">현재 화면 수집</text>
    <text class="node-body" x="200" y="574">Accessibility tree 우선</text>
    <text class="node-body" x="200" y="593">문구 없을 때만 Vision</text>
  </g>

  <path class="flow" d="M 295 559 H 340"/>

  <g aria-label="기능 후보 순위 계산">
    <rect class="node" x="340" y="515" width="225" height="88" rx="16"/>
    <text class="node-title" x="452" y="548">기능 후보 순위</text>
    <text class="node-body" x="452" y="574">로컬 의미 점수 + AndroidControl</text>
    <text class="node-body" x="452" y="593">모호할 때만 K-EXAONE</text>
  </g>

  <path class="flow" d="M 565 559 H 610"/>

  <g aria-label="안전 필터">
    <rect class="node node-amber" x="610" y="515" width="190" height="88" rx="16"/>
    <text class="node-title" x="705" y="548">안전 필터</text>
    <text class="node-body" x="705" y="574">탐색용 이동 버튼만 허용</text>
    <text class="node-body" x="705" y="593">결제·삭제·토글 차단</text>
  </g>

  <path class="flow" d="M 800 559 H 845"/>

  <g aria-label="안전한 메뉴 자동 조작">
    <rect class="node node-teal" x="845" y="515" width="195" height="88" rx="16"/>
    <text class="node-title" x="942" y="548">안전 메뉴 자동 클릭</text>
    <text class="node-body" x="942" y="574">클릭 · 스크롤 · 뒤로가기</text>
    <text class="node-body" x="942" y="593">화면 안정화 대기</text>
  </g>

  <path class="flow" d="M 1040 559 H 1085"/>

  <g aria-label="화면 전이 기록">
    <rect class="node" x="1085" y="515" width="175" height="88" rx="16"/>
    <text class="node-title" x="1172" y="548">전이 기록</text>
    <text class="node-body" x="1172" y="574">화면 지문 · 버튼 · 결과</text>
    <text class="node-body" x="1172" y="593">임시 기능 그래프 생성</text>
  </g>

  <path class="flow" d="M 1172 603 V 621"/>

  <g aria-label="최종 목적지 증거가 충분한지 확인">
    <path class="decision" d="M 1172 621 L 1260 675 L 1172 729 L 1084 675 Z"/>
    <text class="decision-text" x="1172" y="670">목적지 증거</text>
    <text class="decision-text" x="1172" y="691">충분?</text>
  </g>

  <path class="flow-accent" d="M 1260 675 H 1305"/>
  <text class="edge-label-accent" x="1271" y="660">예</text>

  <g aria-label="최종 목적지와 사용자 안내 경로 확정">
    <rect class="node node-green" x="1305" y="620" width="210" height="110" rx="18"/>
    <circle class="step-circle" cx="1327" cy="640" r="13"/><text class="step-number" x="1327" y="640">5</text>
    <text class="node-title" x="1410" y="660">목적지 · 경로 확정</text>
    <text class="node-body" x="1410" y="688">종착 화면과 완료 조건 검증</text>
    <text class="node-body" x="1410" y="710">사용자 안내 경로 재구성</text>
  </g>

  <path class="flow" d="M 1084 675 H 990"/>
  <text class="edge-label" x="1020" y="659">아니요</text>

  <g aria-label="탐색 예산 확인">
    <path class="decision" d="M 900 621 L 990 675 L 900 729 L 810 675 Z"/>
    <text class="decision-text" x="900" y="670">시간·횟수</text>
    <text class="decision-text" x="900" y="691">남음?</text>
  </g>

  <path class="flow" d="M 810 675 H 735"/>
  <text class="edge-label" x="760" y="659">예</text>

  <g aria-label="다음 후보로 백트래킹">
    <rect class="node" x="510" y="632" width="225" height="86" rx="16"/>
    <text class="node-title" x="622" y="665">백트래킹 · 다음 후보</text>
    <text class="node-body" x="622" y="692">중복 화면 제외 후 재탐색</text>
  </g>

  <path class="flow" d="M 510 675 H 200 V 603"/>

  <path class="flow" d="M 900 729 V 751"/>
  <text class="edge-label" x="915" y="746">아니요</text>
  <rect class="node node-red" x="790" y="744" width="220" height="30" rx="15"/>
  <text class="badge-text" x="900" y="764">안내 보류 · 추가 탐색 선택</text>

  <!-- A verified same-version route skips generic exploration and joins guarded reuse -->
  <path class="flow-accent" d="M 1412 312 V 350 H 1532 V 939 H 1270"/>
  <text class="edge-label-accent" x="1165" y="800">검증 후보: 범용 탐색 생략 → 저위험 경로 재사용</text>

  <!-- Lane 3: Guarded verified-route reuse and user-owned final action -->
  <rect class="lane" x="45" y="810" width="1510" height="235" rx="24"/>
  <text class="lane-title" x="70" y="847">3 · 검증 경로의 제한 재사용 → 최종 행동은 사용자 소유</text>
  <text class="lane-note" x="70" y="871">같은 앱·버전에서 검증된 저위험 중간 메뉴만 최대 2회 자동 실행하며, 최종 상태 변경은 사용자가 직접 누릅니다.</text>

  <path class="flow" d="M 1410 730 V 912 H 1270"/>

  <g aria-label="경로의 신뢰 상태와 앱 버전을 확인">
    <rect class="node node-amber" x="1050" y="888" width="220" height="102" rx="18"/>
    <circle class="step-circle" cx="1072" cy="908" r="13"/><text class="step-number" x="1072" y="908">6</text>
    <text class="node-title" x="1160" y="928">경로 신뢰 · 버전 확인</text>
    <text class="node-body" x="1160" y="956">shadow는 자동 재사용 금지</text>
    <text class="node-body" x="1160" y="977">verified candidate만 진행</text>
  </g>

  <path class="flow" d="M 1050 939 H 995"/>

  <g aria-label="검증된 저위험 중간 메뉴만 자동 클릭">
    <rect class="node node-blue" x="775" y="888" width="220" height="102" rx="18"/>
    <circle class="step-circle" cx="797" cy="908" r="13"/><text class="step-number" x="797" y="908">7</text>
    <text class="node-title" x="885" y="930">저위험 중간 메뉴 실행</text>
    <text class="node-body" x="885" y="958">표시·활성·비체크 조건</text>
    <text class="node-body" x="885" y="979">자동 클릭 최대 2회</text>
  </g>

  <path class="flow" d="M 775 939 H 720"/>

  <g aria-label="자동 클릭 후 예상 화면 전이를 검증하고 불일치 시 fallback">
    <rect class="node node-green" x="500" y="888" width="220" height="102" rx="18"/>
    <circle class="step-circle" cx="522" cy="908" r="13"/><text class="step-number" x="522" y="908">8</text>
    <text class="node-title" x="610" y="930">전환 검증 · fallback</text>
    <text class="node-body" x="610" y="958">의미 화면과 그래프 매칭</text>
    <text class="node-body" x="610" y="979">불일치 2회 이내 폐기</text>
  </g>

  <path class="flow" d="M 500 939 H 445"/>
  <text class="edge-label-accent" x="452" y="925">도착</text>

  <g aria-label="최종 목적지 도착을 확인하고 성공 경로 갱신">
    <rect class="node node-purple" x="145" y="882" width="300" height="114" rx="18"/>
    <circle class="step-circle" cx="167" cy="902" r="13"/><text class="step-number" x="167" y="902">9</text>
    <text class="node-title" x="295" y="924">목적지 도착 · 그래프 갱신</text>
    <text class="node-body" x="295" y="952">최종 실행은 사용자 선택</text>
    <text class="node-body" x="295" y="974">안전 정지 · 성능 기록</text>
  </g>

  <path class="flow-accent" d="M 610 990 V 1018 H 885 V 990"/>
  <text class="edge-label-accent" x="675" y="1012">일치: 다음 검증 단계</text>

  <path class="flow-dashed" d="M 295 996 V 1055 H 1537 V 120 H 867 V 205"/>
  <text class="edge-label-accent" x="500" y="1050">다음 요청: 같은 버전의 검증 후보를 먼저 확인 → 빠른 재사용</text>

  <!-- Footer constraints -->
  <line x1="62" y1="1080" x2="1538" y2="1080" stroke="var(--border)" stroke-width="1"/>
  <text class="footer-strong" x="62" y="1106">운영 원칙</text>
  <text class="footer" x="150" y="1106">저위험 중간 메뉴만 제한 자동화 · 최종 행동은 사용자 직접 클릭 · UI 불일치 시 경로 폐기 · 근거 부족 시 안전 정지</text>
</svg>
