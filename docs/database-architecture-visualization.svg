  <text x="349" y="664" class="item-muted">자동 실행 금지 2,461</text>
  <text x="563" y="664" class="item-muted">조건부 3</text>

  <rect x="92" y="700" width="639" height="83" rx="16" fill="#EEF2FF"/>
  <text x="112" y="731" class="section-label" fill="#365BCB">입력 예시</text>
  <text x="112" y="759" class="item">“유튜브 프리미엄 끊고 싶어”</text>
  <path d="M400 752h38" stroke="#4D72E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="759" class="item" font-family="Consolas, monospace" fill="#365BCB">subscription.cancel.entry</text>

  <!-- Right panel -->
  <rect x="835" y="145" width="705" height="675" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="1530" y="145" width="10" height="675" rx="5" fill="#22A37A"/>
  <circle cx="887" cy="198" r="25" fill="#E4F7F0"/>
  <circle cx="878" cy="194" r="5" fill="#22A37A"/>
