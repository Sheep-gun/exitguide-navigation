  <text x="112" y="438" class="item">긍정 문맥 단서</text>
  <text x="304" y="438" class="item" font-weight="700">42,365개</text>
  <text x="423" y="438" class="item">부정 문맥 단서</text>
  <text x="617" y="438" class="item" font-weight="700">66,865개</text>
  <text x="112" y="469" class="item-muted">표현 충돌 그룹 388개 · 충돌 방지 조합 877개 · 의미 동등 관계 240개</text>

  <text x="92" y="537" class="section-label">위험도 및 자동화 정책</text>
  <text x="92" y="568" class="item-muted">위험도</text>
  <rect x="166" y="554" width="522" height="18" rx="9" fill="#E8EBF1"/>
  <rect x="166" y="554" width="401" height="18" rx="9" fill="#E95B55"/>
  <rect x="567" y="554" width="47" height="18" fill="#F2B84B"/>
  <rect x="614" y="554" width="74" height="18" rx="9" fill="#5EA98B"/>
  <text x="166" y="597" class="item-muted">고위험 2,202</text>
  <text x="315" y="597" class="item-muted">중위험 259</text>
  <text x="447" y="597" class="item-muted">저위험 405</text>

  <text x="92" y="635" class="item-muted">자동화</text>
  <rect x="166" y="621" width="522" height="18" rx="9" fill="#E8EBF1"/>
  <rect x="166" y="621" width="73" height="18" rx="9" fill="#4D72E8"/>
  <rect x="239" y="621" width="448" height="18" rx="9" fill="#AEB8C8"/>
