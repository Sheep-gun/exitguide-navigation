  <rect x="867" y="407" width="639" height="90" rx="16" fill="#F8F9FC"/>
  <text x="887" y="438" class="item">자동 탐색 실행 <tspan font-weight="700">95회</tspan></text>
  <text x="1094" y="438" class="item">탐색 시도 <tspan font-weight="700">284개</tspan></text>
  <text x="1287" y="438" class="item">탐색 단계 <tspan font-weight="700">806개</tspan></text>
  <text x="887" y="469" class="item">경로 후보 <tspan font-weight="700">38개</tspan></text>
  <rect x="1068" y="449" width="112" height="28" rx="14" fill="#FFF3D7"/>
  <text x="1124" y="468" text-anchor="middle" class="badge" fill="#8A6416">Shadow 37</text>
  <rect x="1192" y="449" width="92" height="28" rx="14" fill="#FBE9E8"/>
  <text x="1238" y="468" text-anchor="middle" class="badge" fill="#A23E38">Stale 1</text>
  <rect x="1296" y="449" width="170" height="28" rx="14" fill="#EEF0F4"/>
  <text x="1381" y="468" text-anchor="middle" class="badge" fill="#65738A">Verified 0</text>

  <text x="867" y="537" class="section-label">대표 앱별 데이터</text>
  <text x="887" y="570" class="table-head">앱</text>
  <text x="1122" y="570" class="table-head" text-anchor="end">화면</text>
  <text x="1288" y="570" class="table-head" text-anchor="end">버튼·메뉴</text>
  <text x="1466" y="570" class="table-head" text-anchor="end">이동</text>
  <line x1="867" y1="582" x2="1506" y2="582" stroke="#DDE2EA"/>

  <g class="table-cell">
    <text x="887" y="610">유튜브</text><text x="1122" y="610" text-anchor="end">231</text><text x="1288" y="610" text-anchor="end">4,815</text><text x="1466" y="610" text-anchor="end">123</text>
    <line x1="867" y1="624" x2="1506" y2="624" stroke="#EDF0F4"/>
    <text x="887" y="651">넷플릭스</text><text x="1122" y="651" text-anchor="end">45</text><text x="1288" y="651" text-anchor="end">1,303</text><text x="1466" y="651" text-anchor="end">15</text>
    <line x1="867" y1="665" x2="1506" y2="665" stroke="#EDF0F4"/>
    <text x="887" y="692">인스타그램</text><text x="1122" y="692" text-anchor="end">58</text><text x="1288" y="692" text-anchor="end">959</text><text x="1466" y="692" text-anchor="end">2</text>
    <line x1="867" y1="706" x2="1506" y2="706" stroke="#EDF0F4"/>
    <text x="887" y="733">X(트위터)</text><text x="1122" y="733" text-anchor="end">53</text><text x="1288" y="733" text-anchor="end">620</text><text x="1466" y="733" text-anchor="end">3</text>
    <line x1="867" y1="747" x2="1506" y2="747" stroke="#EDF0F4"/>
    <text x="887" y="774">제주항공</text><text x="1122" y="774" text-anchor="end">19</text><text x="1288" y="774" text-anchor="end">365</text><text x="1466" y="774" text-anchor="end">9</text>
  </g>

  <!-- K-EXAONE reasoning layer -->
  <path d="M412 820v26M1188 820v26" stroke="#7B61D1" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="220" y="850" width="1160" height="118" rx="24" fill="#F1EDFF" stroke="#C8BBF5" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="270" cy="909" r="28" fill="#7B61D1"/>
  <path d="M257 909h26M270 896v26M261 900l18 18M279 900l-18 18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="314" y="895" class="panel-title" fill="#6045B5">K-EXAONE 추론 엔진</text>
  <text x="314" y="924" class="panel-subtitle">두 DB를 읽고 현재 상황에 맞는 결정을 생성</text>
  <rect x="740" y="875" width="184" height="68" rx="16" fill="#FFFFFF"/>
  <text x="832" y="903" text-anchor="middle" class="flow-title">목적 의미 해석</text>
  <text x="832" y="925" text-anchor="middle" class="flow-detail">모호한 표현·문맥 보정</text>
  <rect x="938" y="875" width="184" height="68" rx="16" fill="#FFFFFF"/>
  <text x="1030" y="903" text-anchor="middle" class="flow-title">버튼 후보 순위화</text>
  <text x="1030" y="925" text-anchor="middle" class="flow-detail">목표와 화면의 의미 매칭</text>
  <rect x="1136" y="875" width="214" height="68" rx="16" fill="#FFFFFF"/>
  <text x="1243" y="903" text-anchor="middle" class="flow-title">경로 복구·재탐색</text>
  <text x="1243" y="925" text-anchor="middle" class="flow-detail">이탈·UI 변경 시 대안 선택</text>

  <!-- Integration flow -->
  <text x="70" y="1012" class="panel-title">전체 연동 과정</text>
  <text x="70" y="1042" class="panel-subtitle">기능 분류 DB와 그래프 DB가 근거를 제공하고, K-EXAONE이 후보를 해석·순위화한다.</text>

  <g>
    <rect x="70" y="1080" width="190" height="112" rx="20" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="2"/>
    <circle cx="104" cy="1114" r="15" fill="#E9EEF9"/>
    <text x="104" y="1120" text-anchor="middle" font-size="18" font-weight="700" fill="#4D72E8">1</text>
    <text x="128" y="1120" class="flow-title">사용자 목적</text>
    <text x="92" y="1153" class="flow-detail">“프리미엄 구독을</text>
    <text x="92" y="1174" class="flow-detail">해지하고 싶어”</text>

    <path d="M271 1136h47" stroke="#65738A" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="330" y="1080" width="210" height="112" rx="20" fill="#EEF2FF" stroke="#AFC0F7" stroke-width="2"/>
    <circle cx="364" cy="1114" r="15" fill="#4D72E8"/>
    <text x="364" y="1120" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="389" y="1120" class="flow-title">기능 분류</text>
    <text x="352" y="1153" class="flow-detail">자연어 → 표준 기능 ID</text>
    <text x="352" y="1174" class="flow-detail" font-family="Consolas, monospace">subscription.cancel.entry</text>

    <path d="M551 1136h47" stroke="#65738A" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="610" y="1080" width="210" height="112" rx="20" fill="#ECF8F4" stroke="#9FDCC7" stroke-width="2"/>
    <circle cx="644" cy="1114" r="15" fill="#22A37A"/>
    <text x="644" y="1120" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="669" y="1120" class="flow-title">현재 화면 인식</text>
    <text x="632" y="1153" class="flow-detail">앱·화면·버튼 후보 추출</text>
    <text x="632" y="1174" class="flow-detail">Accessibility UI 구조 활용</text>

    <path d="M831 1136h47" stroke="#65738A" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="890" y="1080" width="210" height="112" rx="20" fill="#F1EDFF" stroke="#C8BBF5" stroke-width="2"/>
    <circle cx="924" cy="1114" r="15" fill="#7B61D1"/>
    <text x="924" y="1120" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
    <text x="949" y="1120" class="flow-title">K-EXAONE 판단</text>
    <text x="912" y="1153" class="flow-detail">그래프 후보를 의미 기반으로</text>
    <text x="912" y="1174" class="flow-detail">순위화하고 다음 메뉴 선택</text>

    <path d="M1111 1136h47" stroke="#65738A" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1170" y="1080" width="210" height="112" rx="20" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="2"/>
    <circle cx="1204" cy="1114" r="15" fill="#E9EEF9"/>
    <text x="1204" y="1120" text-anchor="middle" font-size="18" font-weight="700" fill="#4D72E8">5</text>
    <text x="1229" y="1120" class="flow-title">최종 목적지</text>
    <text x="1192" y="1153" class="flow-detail">구독 관리·해지 화면 도달</text>
    <text x="1192" y="1174" class="flow-detail">최종 실행은 하지 않음</text>

    <path d="M1391 1136h35" stroke="#65738A" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1438" y="1080" width="102" height="112" rx="20" fill="#FFF3D7" stroke="#F0C96E" stroke-width="2"/>
    <text x="1489" y="1121" text-anchor="middle" class="flow-title">사용자</text>
    <text x="1489" y="1147" text-anchor="middle" class="flow-title">최종 클릭</text>
    <text x="1489" y="1174" text-anchor="middle" class="flow-detail">통제권 보장</text>
  </g>

  <line x1="70" y1="1245" x2="1530" y2="1245" stroke="#DDE2EA"/>
  <circle cx="83" cy="1282" r="5" fill="#F2B84B"/>
  <text x="99" y="1288" class="footnote">K-EXAONE은 DB를 대체하지 않는다. DB의 근거를 바탕으로 모호한 목적과 버튼 후보를 판단하며, 최종 상태 변경은 사용자가 수행한다.</text>
</svg>
