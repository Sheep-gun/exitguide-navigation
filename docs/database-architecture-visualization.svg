  <circle cx="898" cy="207" r="5" fill="#22A37A"/>
  <path d="M882 193l10-4M895 193l2 9M883 198l11 7" stroke="#22A37A" stroke-width="2"/>
  <text x="926" y="193" class="panel-title">2. 앱별 기능 그래프 DB</text>
  <text x="926" y="220" class="panel-subtitle">화면·버튼·이동 관계를 저장 — “어떻게 찾아갈 것인가?”</text>

  <!-- Right stat cards -->
  <g>
    <rect x="867" y="255" width="150" height="92" rx="16" fill="#ECF8F4"/>
    <text x="885" y="294" class="stat-value" fill="#16815F">39</text>
    <text x="885" y="323" class="stat-label">앱·패키지</text>

    <rect x="1030" y="255" width="150" height="92" rx="16" fill="#ECF8F4"/>
    <text x="1048" y="294" class="stat-value" fill="#16815F">746</text>
    <text x="1048" y="323" class="stat-label">화면 구조</text>

    <rect x="1193" y="255" width="150" height="92" rx="16" fill="#ECF8F4"/>
    <text x="1211" y="294" class="stat-value" fill="#16815F">13,523</text>
    <text x="1211" y="323" class="stat-label">버튼·메뉴 후보</text>

    <rect x="1356" y="255" width="150" height="92" rx="16" fill="#ECF8F4"/>
    <text x="1374" y="294" class="stat-value" fill="#16815F">362</text>
    <text x="1374" y="323" class="stat-label">화면 이동 관계</text>
  </g>

