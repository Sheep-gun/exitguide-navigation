<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" role="img" aria-labelledby="title desc">
  <title id="title">ExitGuide Navigation 데이터베이스 구조 및 구축 현황</title>
  <desc id="desc">목적·기능 분류 데이터베이스와 앱별 기능 그래프 데이터베이스의 규모, K-EXAONE의 추론 역할, 전체 연동 과정을 보여주는 인포그래픽</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#65738A"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #172033; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #65738A; }
      .panel-title { font-size: 28px; font-weight: 700; }
      .panel-subtitle { font-size: 17px; fill: #65738A; }
      .stat-value { font-size: 31px; font-weight: 700; }
      .stat-label { font-size: 15px; fill: #65738A; }
      .section-label { font-size: 17px; font-weight: 700; }
      .item { font-size: 15px; }
      .item-muted { font-size: 14px; fill: #65738A; }
      .table-head { font-size: 14px; font-weight: 700; fill: #65738A; }
      .table-cell { font-size: 14px; }
      .flow-title { font-size: 16px; font-weight: 700; }
      .flow-detail { font-size: 13px; fill: #65738A; }
      .badge { font-size: 13px; font-weight: 700; }
      .footnote { font-size: 14px; fill: #65738A; }
    </style>
  </defs>

  <rect width="1600" height="1330" fill="#F5F7FB"/>

  <!-- Header -->
  <text x="70" y="72" class="title">ExitGuide Navigation 데이터베이스 구조</text>
  <text x="70" y="108" class="subtitle">사용자의 목적을 이해하는 DB와 실제 앱 안에서 길을 찾는 DB가 결합된 구조</text>
  <rect x="1328" y="54" width="202" height="42" rx="21" fill="#E9EEF9"/>
  <text x="1429" y="81" text-anchor="middle" class="badge" fill="#46566F">CATALOG v15.0.0</text>

  <!-- Left panel -->
  <rect x="60" y="145" width="705" height="675" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="60" y="145" width="10" height="675" rx="5" fill="#4D72E8"/>
  <circle cx="112" cy="198" r="25" fill="#E8EEFF"/>
  <path d="M101 198h22M112 187v22" stroke="#4D72E8" stroke-width="3" stroke-linecap="round"/>
  <text x="151" y="193" class="panel-title">1. 목적·기능 분류 DB</text>
  <text x="151" y="220" class="panel-subtitle">사용자 문장을 표준 기능 ID로 변환 — “무엇을 찾을 것인가?”</text>

  <!-- Left stat cards -->
  <g>
    <rect x="92" y="255" width="150" height="92" rx="16" fill="#F1F4FF"/>
    <text x="110" y="294" class="stat-value" fill="#365BCB">2,866</text>
    <text x="110" y="323" class="stat-label">표준 기능</text>

    <rect x="255" y="255" width="150" height="92" rx="16" fill="#F1F4FF"/>
    <text x="273" y="294" class="stat-value" fill="#365BCB">2,660</text>
    <text x="273" y="323" class="stat-label">사용자 의도</text>

    <rect x="418" y="255" width="150" height="92" rx="16" fill="#F1F4FF"/>
    <text x="436" y="294" class="stat-value" fill="#365BCB">6,856</text>
    <text x="436" y="323" class="stat-label">한·영 유사 표현</text>

    <rect x="581" y="255" width="150" height="92" rx="16" fill="#F1F4FF"/>
    <text x="599" y="294" class="stat-value" fill="#365BCB">179</text>
    <text x="599" y="323" class="stat-label">기능 분야</text>
  </g>

